name: NovaTech CI/CD Pipeline

on:
    push:
        branches: [main]   
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint Check 
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install HTMLHint
              run: npm install -g htmlhint
            
            - name: Run HTMLHint
              run: htmlhint "*.html"

    test:
        name: Run Tests
        runs-on: ubuntu-latest
        needs: [lint]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run tests
              run: |
                chmod +x tests/validate.sh
                ./tests/validate.sh

    build:
        name: Build Artifact
        runs-on: ubuntu-latest
        needs: [test]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create ZIP package
              run: zip -r app-package.zip index.html style.css config.json
            
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: app-package
                path: app-package.zip

    deploy-staging:
        name: Deploy to Staging
        runs-on: ubuntu-latest
        needs: [build]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        environment: staging

        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                name: app-package

            - name: Deploy to staging
              run: |
               echo "Deploying to staging..."
               unzip app-package.zip -d ./deploy
               echo "Staging deployment complete"

    deploy-production:
        name: Deploy to production
        runs-on: ubuntu-latest
        needs: [deploy-staging]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        environment: production

        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                name: app-package

            - name: Deploy to production
              run:
                echo "Deploying to production..."
                unzip app-package.zip -d ./deploy
                echo "production deployment complete"


